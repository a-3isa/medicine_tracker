name: medicine_tracker
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: '>=3.3.2 <4.0.0'


dependencies:
  alarm:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  permission_handler: ^11.1.0
  table_calendar : ^3.0.9
  shared_preferences: ^2.0.0
  printing: ^5.7.2

  mocktail: ^1.0.3
  flutter_local_notifications: ^17.1.2
  firebase_messaging: ^14.2.2
  timezone: ^0.9.3
  arabic_font: ^0.0.9
  syncfusion_flutter_calendar: ^25.1.39 
  image_picker: ^1.1.1
  path_provider: ^2.0.6
  intl: ^0.19.0
  scoped_model: 2.0.0
  cupertino_icons: ^1.0.6
  pdf: ^3.10.8
  share_plus: ^9.0.0
  excel: ^2.0.0

  two_dimensional_scrollables: ^0.3.0
  auto_size_text: ^3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  very_good_analysis: ^5.1.0


flutter:
  generate: true  # Enables code generation for localizations
  uses-material-design: true
  assets:
    - assets/1.png
    - assets/1.jpg
    - assets/NotoSans-Regular.ttf
    - assets/Cairo-Regular.ttf
    - assets/NotoSansArabic-Regular.ttf
    - assets/mozart.mp3
    - assets/nokia.mp3
    - assets/one_piece.mp3
    - assets/star_wars.mp3
    - assets/marimba.mp3
